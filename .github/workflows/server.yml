name: server
on:
  push:
    paths: ['server/**', 'web/src/game/net/protocol*', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'web/src/game/net/protocol*', '.github/workflows/server.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm test -- --run src/game/net/protocol-fixtures.test.ts
        working-directory: web
      - run: cargo build --locked --release
      - run: docker build -t temple-server:test .
